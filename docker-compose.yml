version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - SA_PASSWORD=Password123!
      - ACCEPT_EULA=Y
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - microservices-network

  gateway-api:
    build:
      context: .
      dockerfile: src/Gateway/Gateway.API/Dockerfile
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - Services__Tenant=http://tenant-api
      - Services__Identity=http://identity-api
      - Services__Authorization=http://authorization-api
      - Jwt__Key=YourVeryLongSecretKeyHereThatIsAtLeast256BitsLong
      - Jwt__Issuer=http://identity-api
      - Jwt__Audience=http://gateway-api
    depends_on:
      - tenant-api
      - identity-api
      - authorization-api
    networks:
      - microservices-network

  tenant-api:
    build:
      context: .
      dockerfile: src/Tenant/Tenant.API/Dockerfile
    ports:
      - "5001:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=TenantDb;User Id=sa;Password=Password123!;TrustServerCertificate=True;
      - JWT__ValidIssuer=http://identity-api
      - JWT__ValidAudience=http://gateway-api
      - JWT__Secret=YourVeryLongSecretKeyHereThatIsAtLeast256BitsLong
    depends_on:
      - sqlserver
    networks:
      - microservices-network

  identity-api:
    build:
      context: .
      dockerfile: src/Identity/Identity.API/Dockerfile
    ports:
      - "5002:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=IdentityDB;User Id=sa;Password=Password123!;TrustServerCertificate=True;
      - JWT__ValidIssuer=http://identity-api
      - JWT__ValidAudience=http://gateway-api
      - JWT__Secret=YourVeryLongSecretKeyHereThatIsAtLeast256BitsLong
    depends_on:
      - sqlserver
    networks:
      - microservices-network

  authorization-api:
    build:
      context: .
      dockerfile: src/Authorization/Authorization.API/Dockerfile
    ports:
      - "5003:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=AuthorizationDB;User Id=sa;Password=Password123!;TrustServerCertificate=True;
      - Services__Identity=http://identity-api
      - JWT__ValidIssuer=http://identity-api
      - JWT__ValidAudience=http://gateway-api
      - JWT__Secret=YourVeryLongSecretKeyHereThatIsAtLeast256BitsLong
    depends_on:
      - sqlserver
      - identity-api
    networks:
      - microservices-network

networks:
  microservices-network:
    driver: bridge

volumes:
  sqlserver_data:
